name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency: release

jobs:
  release:
    if: github.repository == 'sloria/archie-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # zizmor: ignore[adhoc-packages]
      - run: npm ci
      - name: Changesets version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
